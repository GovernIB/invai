# --- Configuración Base Local ---
spring.application.name=invai
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- CORS para tu Front End en local ---
app.cors.allowed-origin=http://localhost:3000

# --- OAuth2 / Soffid (Redirección a tu Máquina Local) ---
spring.security.oauth2.client.registration.soffid.issuer=https://idp.caib.es
spring.security.oauth2.client.registration.soffid.client-id=goib-default-des
spring.security.oauth2.client.registration.soffid.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.soffid.redirect-uri=http://localhost:8080/invaiback/login/oauth2/code/soffid
spring.security.oauth2.client.registration.soffid.scope=openid
spring.security.oauth2.client.registration.soffid.client-authentication-method=none

# --- IdP Provider Settings ---
spring.security.oauth2.client.provider.soffid.authorization-uri=https://idp.caib.es/auth/realms/soffid/protocol/openid-connect/auth
spring.security.oauth2.client.provider.soffid.token-uri=https://idp.caib.es/auth/realms/soffid/protocol/openid-connect/token
spring.security.oauth2.client.provider.soffid.user-info-uri=https://idp.caib.es/auth/realms/soffid/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.soffid.user-name-attribute=preferred_username
spring.security.oauth2.client.provider.soffid.jwk-set-uri=https://idp.caib.es/auth/realms/soffid/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.client.provider.soffid.jwk-set-uri}

es.caib.invai.integracions.base-url=http://localhost:8080/invaiapi/interna
# Tiempo maximo, en segundos, para conectar con invai-api-interna y para recibir su respuesta (en invai-back; obligatorias).
# El de respuesta debe ser mayor que es.caib.invai.soffid.request-timeout-seconds (el mayor de los que aplica invai-api-interna),
# para que llegue antes su 504; si no, el fallo se ve como servicio no disponible, no como timeout.
es.caib.invai.integracions.connect-timeout-seconds=5
es.caib.invai.integracions.response-timeout-seconds=12

# --- Soffid SCIM settings ---
es.caib.invai.soffid.base-url=https://proves.caib.es
es.caib.invai.soffid.username=$invai_soffid
es.caib.invai.soffid.password=1?kxVmW!(K6ta;tZ
es.caib.invai.soffid.user-search-path=/soffid/webservice/scim2/v1/User/
es.caib.invai.soffid.role-search-path=/soffid/webservice/scim2/v1/Role/
es.caib.invai.soffid.group-search-path=/soffid/webservice/scim2/v1/Group/
es.caib.invai.soffid.granted-role-path=/soffid/webservice/scim2/v1/RoleAccount
# Direcciones de correo por llamada a Soffid al cargar los datos de la auditoria DIR3 masiva (si se omite, 50).
# Soffid rechaza el filtro (HTTP 414) a partir de ~100; invai-api-interna acepta como maximo 100.
es.caib.invai.soffid.users-batch-size=50
# Tiempo maximo de espera, en segundos, a la respuesta de Soffid (en invai-api-interna; obligatoria).
# Soffid puede tardar hasta ~10 s: con este valor una respuesta lenta dara timeout.
es.caib.invai.soffid.request-timeout-seconds=10
# Tiempo maximo, en segundos, para conectar con Soffid y para recibir su respuesta (en invai-api-interna; obligatorias).
# Si el de respuesta es menor o igual que request-timeout-seconds, salta antes y el fallo se ve como servicio no disponible, no como timeout.
es.caib.invai.soffid.connect-timeout-seconds=5
es.caib.invai.soffid.response-timeout-seconds=11

# --- Niveles de Trazas en Local ---
logging.level.root=INFO
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.security=TRACE

# --- Database and Hibernate Configuration ---
spring.datasource.jndi-name=java:jboss/datasources/invaiDS

# --- Hibernate Dialect ---
es.caib.invai.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
es.caib.invai.hibernate.query.substitutions=true 1, false 0

# --- SQL Debug logging properties ---
es.caib.invai.hibernate.show_sql=true
es.caib.invai.hibernate.format_sql=true

es.caib.invai.login.host=http://localhost:8080/invaiback
es.caib.invai.front.url.success=http://localhost:8080/invaifront/ca/aplicacions

es.caib.invai.idp.logout.url=https://idp.caib.es/logout

# --- Dir3 Provider Settings ---
es.caib.invai.dir3caib.base-url=https://se.caib.es/dir3caib
es.caib.invai.dir3caib.tree-path=/rest/unidades/obtenerArbolUnidades
es.caib.invai.dir3caib.username=$invai_dir3caib
es.caib.invai.dir3caib.password=invai_dir3caib
es.caib.invai.dir3caib.root-adm-unit-code=A04003003
es.caib.invai.dir3caib.department-hierarchy-level=2
# Tiempo maximo, en segundos, para conectar con DIR3CAIB y para recibir su respuesta (en invai-api-interna; obligatorias).
es.caib.invai.dir3caib.connect-timeout-seconds=3
es.caib.invai.dir3caib.response-timeout-seconds=5

# --- Externa Settings ---
es.caib.invai.data.base-url=https://intranet.caib.es
es.caib.invai.data.opendata.path-prefix=api/externa
es.caib.invai.data.reuse.path-prefix=api/interna
# Tiempo maximo, en segundos, para conectar con la URL de una aplicacion y para recibir su respuesta al comprobarla (en invai-api-interna; obligatorias).
es.caib.invai.data.connect-timeout-seconds=3
es.caib.invai.data.response-timeout-seconds=5

server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=43200

