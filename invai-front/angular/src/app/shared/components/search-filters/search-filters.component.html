<div class="invai-filter-panel flex flex-column gap-5">
  <div class="flex flex-column gap-4">
    <ng-container
      [ngTemplateOutlet]="filterHeading"
      [ngTemplateOutletContext]="{ $implicit: title() }"
    />
    <ng-content />
  </div>

  @if (!isMoreFiltersCollapsed()) {
    <div class="flex flex-column gap-4">
      <ng-container
        [ngTemplateOutlet]="filterHeading"
        [ngTemplateOutletContext]="{ $implicit: moreFiltersTitle }"
      />
      <ng-content select="[more-filters]" />
    </div>
  }

  <footer class="flex flex-wrap gap-3 justify-content-between align-items-center">
    <section class="flex flex-wrap justify-content-start gap-3">
      <p-button
        styleClass="invai-filter-action"
        [disabled]="isDisable()"
        [loading]="isLoading()"
        (onClick)="search()"
        icon="pi pi-search"
        [label]="searchLabel"
        size="large"
      ></p-button>
      <p-button
        styleClass="invai-filter-action"
        [text]="true"
        (click)="reset()"
        icon="pi pi-eraser"
        [label]="resetLabel"
        size="large"
      ></p-button>
    </section>
    @if (!hideMoreFiltersButton()) {
      <p-button
        [icon]="iconMoreFilters()"
        [label]="labelMoreFilters()"
        [text]="true"
        [pt]="moreFiltersPassThrough()"
        (click)="onToggleMoreFiltersCollapsed()"
      />
    }
  </footer>
</div>

<ng-template #filterHeading let-text>
  @switch (headingLevel()) {
    @case (3) {
      <h3 class="font-semibold text-xl text-color">{{ text }}</h3>
    }
    @case (4) {
      <h4 class="font-semibold text-xl text-color">{{ text }}</h4>
    }
    @default {
      <h2 class="font-semibold text-xl text-color">{{ text }}</h2>
    }
  }
</ng-template>
