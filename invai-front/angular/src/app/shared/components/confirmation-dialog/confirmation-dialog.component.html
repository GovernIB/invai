<p-dialog
  [(visible)]="visible"
  [closable]="!pending()"
  [closeOnEscape]="!pending()"
  [dismissableMask]="!pending()"
  [draggable]="false"
  [focusOnShow]="true"
  [modal]="true"
  [resizable]="false"
  [style]="{ width: width(), maxWidth: 'calc(100vw - 2rem)' }"
  (onHide)="onHide()"
>
  <ng-template #header>
    <h2 class="m-0 text-base font-semibold text-color">{{ title() }}</h2>
  </ng-template>

  <div class="flex items-start gap-3 text-sm leading-5 text-color-secondary">
    <i
      class="mt-1 text-color-secondary"
      [class]="PrimeIcons.EXCLAMATION_TRIANGLE"
      aria-hidden="true"
    ></i>
    <p class="m-0 whitespace-pre-line">{{ message() }}</p>
  </div>

  <ng-content />

  <ng-template #footer>
    <div class="flex w-full flex-wrap items-center justify-between gap-2">
      <div>
        @if (auxiliaryLabel()) {
          <p-button
            type="button"
            severity="secondary"
            [ariaLabel]="auxiliaryAriaLabel() || auxiliaryLabel()!"
            [disabled]="pending()"
            [label]="auxiliaryLabel()!"
            [outlined]="true"
            (onClick)="onAuxiliary()"
          />
        }
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2">
        <p-button
          [ariaLabel]="cancelAriaLabel()"
          [disabled]="pending()"
          [label]="cancelLabel()"
          [text]="true"
          severity="secondary"
          (onClick)="onCancel()"
        />
        <p-button
          [ariaLabel]="confirmAriaLabel()"
          [disabled]="pending()"
          [icon]="confirmIcon()"
          [label]="confirmLabel()"
          [loading]="pending()"
          [outlined]="confirmOutlined()"
          [severity]="severity()"
          (onClick)="onConfirm()"
        />
      </div>
    </div>
  </ng-template>
</p-dialog>
