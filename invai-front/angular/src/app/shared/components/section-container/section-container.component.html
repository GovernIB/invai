<div
  [class]="
    'section-container shadow-2 w-full text-color' +
    ' ' +
    bgStyle()
  "
>
  @if (header()) {
    <header class="section-container__header">
      <h1 class="section-container__title">{{ header() }}</h1>
      <div class="section-container__actions">
        <ng-content select="[right-top]"></ng-content>
        <app-help-button [onPrimary]="true" />
      </div>
    </header>
  }
  <div class="section-container__body flex flex-column gap-4">
    <ng-content></ng-content>
  </div>
</div>
