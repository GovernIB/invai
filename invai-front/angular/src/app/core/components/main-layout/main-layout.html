<div class="flex flex-col h-screen overflow-hidden">
  <header
    class="relative flex h-[4.5rem] shrink-0 items-center border-b border-slate-200 bg-white px-3 shadow-xs md:px-6"
  >
    @if (isMobile() && isSidebarVisible()) {
      <button
        pButton
        type="button"
        class="mr-2 size-10 shrink-0 p-0"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        aria-controls="sidebar-navigation-drawer"
        [attr.aria-expanded]="isDrawerVisible()"
        [attr.aria-label]="drawerOpenAriaLabel"
        (click)="openDrawer()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
    }

    <ng-content select="[header-left]" />

    <app-top-menu class="min-w-0 flex-1 overflow-x-auto px-4" />

    <ng-content select="[header-right]" />

    @if (isResolverLoading()) {
      <div
        class="invai-resolver-progress"
        role="progressbar"
        [attr.aria-label]="resolverLoadingAriaLabel"
      ></div>
    }
  </header>

  <div class="flex flex-1 min-h-0 overflow-hidden">
    @if (!isMobile()) {
      <app-sidebar
        class="relative flex flex-col shrink-0 overflow-visible border-r border-slate-200"
      />
    }

    <div class="flex w-full min-w-0 min-h-0 flex-col overflow-y-auto surface-100">
      <main class="flex flex-1 justify-center">
        <ng-content />
      </main>

      <app-footer class="shrink-0" />
    </div>
  </div>
</div>

<p-drawer
  id="sidebar-navigation-drawer"
  position="left"
  styleClass="sidebar-navigation-drawer"
  [appendTo]="'body'"
  [ariaCloseLabel]="drawerCloseAriaLabel"
  [blockScroll]="true"
  [closeOnEscape]="true"
  [dismissible]="true"
  [modal]="true"
  [style]="drawerStyle"
  [visible]="isDrawerVisible()"
  (visibleChange)="setDrawerVisibility($event)"
>
  <ng-template #header>
    <div class="flex min-w-0 flex-1 items-center justify-center gap-2.5">
      <img
        class="h-8 w-auto shrink-0"
        src="assets/images/logo_govern_horizontal.svg"
        alt="Govern de les Illes Balears"
      />
      <span class="h-6 border-l-1 surface-border" aria-hidden="true"></span>
      <img
        class="h-5 w-auto shrink-0"
        src="assets/images/logo-invai.svg"
        [alt]="drawerBrandName"
      />
      <span class="sr-only">{{ drawerNavigationLabel }}</span>
    </div>
  </ng-template>

  <app-sidebar class="flex h-full" variant="drawer" />
</p-drawer>
