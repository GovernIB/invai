<p-breadcrumb
  [styleClass]="styleClass()"
  [home]="HOME"
  [model]="items()"
  [pt]="{ root: { 'aria-label': navigationAriaLabel } }"
>
  <ng-template #item let-item>
    @if (item.routerLink) {
      <a
        class="no-underline text-primary hover:underline"
        [routerLink]="item.routerLink"
        [fragment]="item.fragment"
        [attr.aria-label]="item.label"
      >
        {{ item.label }}
      </a>
    } @else {
      <span class="text-color-secondary" aria-current="page">{{ item.label }}</span>
    }
  </ng-template>
</p-breadcrumb>
