<app-section-container [header]="header">
  <nav class="maintenances-tabs" [attr.aria-label]="sectionsAriaLabel">
    @for (tab of tabs; track tab.id) {
      <a
        class="maintenances-tab"
        [routerLink]="tab.path"
        routerLinkActive="maintenances-tab--active"
        ariaCurrentWhenActive="page"
      >
        {{ tab.label }}
      </a>
    }
  </nav>

  <router-outlet />
</app-section-container>
