<app-crud-entity-dialog
  [(visible)]="visible"
  width="42rem"
  [ariaLabels]="actionAriaLabels"
  [canRestore]="canRestore()"
  [hasUnsavedChanges]="hasUnsavedChanges"
  [isDeleting]="isDeleting()"
  [isLoading]="isLoading()"
  [isSaving]="isSaving()"
  [mode]="mode()"
  [title]="title()"
  (cancelEdit)="cancelEdit.emit()"
  (closed)="closed.emit()"
  (deactivate)="deactivate.emit()"
  (edit)="edit.emit()"
  (restore)="restore.emit()"
  (submitForm)="onSubmit()"
>
  @if (isLoading()) {
    <div class="flex min-h-32 items-center justify-center" role="status">
      <p-progressSpinner [style]="{ width: '2.5rem', height: '2.5rem' }" aria-hidden="true" />
      <span class="sr-only">{{ loadingLabel }}</span>
    </div>
  } @else {
    <form
      class="invai-dialog-form-grid invai-grid grid-cols-1 gap-5 md:grid-cols-2"
      [formGroup]="form()"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <div>
        <p-floatlabel class="w-full">
          <input
            id="role-dialog-name"
            class="w-full"
            type="text"
            maxlength="100"
            formControlName="name"
            [attr.aria-describedby]="isInvalid(form().controls.name) ? 'role-dialog-name-error' : null"
            [attr.aria-invalid]="isInvalid(form().controls.name)"
            [readOnly]="mode() === 'view'"
            [class.invai-form-readonly-control]="mode() === 'view'"
            pInputText
          />
          <label for="role-dialog-name">{{ labels.name }}</label>
        </p-floatlabel>
        @if (isInvalid(form().controls.name)) {
          <p id="role-dialog-name-error" class="mb-0 mt-1 text-sm text-red-600" role="alert">
            {{
              form().controls.name.hasError('required') || form().controls.name.hasError('pattern')
                ? requiredError
                : nameMaxLengthError
            }}
          </p>
        }
      </div>
      <div>
        <p-floatlabel class="w-full">
          <input
            id="role-dialog-name-es"
            class="w-full"
            type="text"
            maxlength="100"
            formControlName="nameEs"
            [attr.aria-describedby]="
              isInvalid(form().controls.nameEs) ? 'role-dialog-name-es-error' : null
            "
            [attr.aria-invalid]="isInvalid(form().controls.nameEs)"
            [readOnly]="mode() === 'view'"
            [class.invai-form-readonly-control]="mode() === 'view'"
            pInputText
          />
          <label for="role-dialog-name-es">{{ labels.nameEs }}</label>
        </p-floatlabel>
        @if (isInvalid(form().controls.nameEs)) {
          <p id="role-dialog-name-es-error" class="mb-0 mt-1 text-sm text-red-600" role="alert">
            {{ nameEsMaxLengthError }}
          </p>
        }
      </div>
    </form>
  }
</app-crud-entity-dialog>
