<app-crud-entity-dialog
  [(visible)]="visible"
  width="38rem"
  [ariaLabels]="actionAriaLabels"
  [canRestore]="canRestore()"
  [hasUnsavedChanges]="hasUnsavedChanges"
  [isLoading]="isLoading()"
  [isSaving]="isSaving()"
  [mode]="mode()"
  [title]="title()"
  (cancelEdit)="cancelEdit.emit()"
  (closed)="closed.emit()"
  (deactivate)="deactivate.emit()"
  (edit)="edit.emit()"
  (restore)="restore.emit()"
  (submitForm)="onSubmit()"
>
  <form
    class="invai-dialog-form-grid invai-grid grid-cols-1 gap-5 md:grid-cols-12"
    [formGroup]="form()"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <div class="md:col-span-8">
      <p-floatlabel class="w-full">
        <input
          id="database-vendor-name"
          class="w-full"
          type="text"
          formControlName="name"
          maxlength="100"
          [attr.aria-describedby]="isInvalid(form().controls.name) ? 'database-vendor-name-error' : null"
          [attr.aria-invalid]="isInvalid(form().controls.name)"
          pInputText
        />
        <label for="database-vendor-name">{{ labels.name }}</label>
      </p-floatlabel>
      @if (isInvalid(form().controls.name)) {
        <p id="database-vendor-name-error" class="mb-0 mt-1 text-sm text-red-600" role="alert">
          {{ requiredError }}
        </p>
      }
    </div>

    <div class="md:col-span-4">
      <p-floatlabel class="w-full">
        <p-inputnumber
          inputId="database-vendor-port"
          styleClass="w-full"
          inputStyleClass="w-full"
          formControlName="defaultPort"
          [attr.aria-describedby]="isInvalid(form().controls.defaultPort) ? 'database-vendor-port-error' : null"
          [attr.aria-invalid]="isInvalid(form().controls.defaultPort)"
          [max]="65535"
          [min]="1"
          [useGrouping]="false"
        />
        <label for="database-vendor-port">{{ labels.defaultPort }}</label>
      </p-floatlabel>
      @if (isInvalid(form().controls.defaultPort)) {
        <p id="database-vendor-port-error" class="mb-0 mt-1 text-sm text-red-600" role="alert">
          {{ portError }}
        </p>
      }
    </div>
  </form>
</app-crud-entity-dialog>
