<form class="invai-search-filter-grid--semantic" appSearchFilterGrid [formGroup]="form()">
  <div class="invai-filter-field--wide">
    <p-floatlabel class="w-full">
      <p-select
        [inputId]="idPrefix() + '-server'"
        styleClass="w-full"
        formControlName="serverId"
        [ariaLabelledBy]="idPrefix() + '-server-label'"
        [ariaFilterLabel]="labels().server"
        [filter]="true"
        [options]="serverOptions()"
        [showClear]="true"
        optionLabel="label"
        optionValue="id"
      />
      <label [id]="idPrefix() + '-server-label'" [for]="idPrefix() + '-server'">
        {{ labels().server }}
      </label>
    </p-floatlabel>
  </div>

  <div class="invai-filter-field--standard">
    <p-floatlabel class="w-full">
      <input
        [id]="idPrefix() + '-service'"
        class="w-full"
        type="text"
        formControlName="service"
        pInputText
      />
      <label [for]="idPrefix() + '-service'">{{ labels().service }}</label>
    </p-floatlabel>
  </div>

  <div class="invai-filter-field--standard">
    <p-floatlabel class="w-full">
      <p-select
        [inputId]="idPrefix() + '-type'"
        styleClass="w-full"
        formControlName="databaseTypeId"
        [ariaLabelledBy]="idPrefix() + '-type-label'"
        [ariaFilterLabel]="labels().databaseType"
        [filter]="true"
        [options]="databaseTypeOptions()"
        [showClear]="true"
        optionLabel="name"
        optionValue="id"
      />
      <label [id]="idPrefix() + '-type-label'" [for]="idPrefix() + '-type'">
        {{ labels().databaseType }}
      </label>
    </p-floatlabel>
  </div>

  @if (showStatus()) {
    <div class="invai-filter-field--compact">
      <p-floatlabel class="w-full">
        <p-select
          [inputId]="idPrefix() + '-status'"
          styleClass="w-full"
          formControlName="status"
          [ariaLabelledBy]="idPrefix() + '-status-label'"
          [options]="statusOptions"
          [showClear]="true"
          optionLabel="label"
          optionValue="value"
        />
        <label [id]="idPrefix() + '-status-label'" [for]="idPrefix() + '-status'">
          {{ labels().status }}
        </label>
      </p-floatlabel>
    </div>
  }
</form>
