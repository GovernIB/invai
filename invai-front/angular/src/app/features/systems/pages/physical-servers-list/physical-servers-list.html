<section class="flex flex-column gap-4" [attr.aria-label]="copy().ariaLabel">
  <app-section-actions
    class="flex justify-content-end"
    [(isFiltersCollapsed)]="isFiltersCollapsed"
    [(quickSearchValue)]="quickSearchTerm"
    [(selectedColumns)]="selectedColumns"
    [availableColumns]="columns"
    [addButtonAriaLabel]="copy().addAriaLabel"
    [disableAddButton]="isServerTypeLoading()"
    [filtersSelected]="selectedFilters()"
    [hideExportButton]="true"
    [isSearchLoading]="isLoading()"
    [quickSearchAriaLabel]="quickSearchAriaLabel"
    [quickSearchPlaceholder]="copy().quickSearchPlaceholder"
    (onAdd)="openCreateDialog()"
    (onQuickSearchChange)="onQuickSearchChange($event)"
  />

  @if (!isFiltersCollapsed()) {
    <app-search-filters
      [hideMoreFiltersButton]="true"
      [isDisable]="isLoading()"
      [isLoading]="isLoading()"
      (onReset)="reset()"
      (onSearch)="onFilterSearch()"
    >
      <app-physical-server-filters-form
        [environmentOptions]="environmentOptions()"
        [form]="filtersForm"
      />
    </app-search-filters>
  }

  <app-infrastructure-table
    [columns]="displayedColumns()"
    [first]="tableFirst()"
    [isInitialLoading]="isInitialLoading()"
    [isLoading]="isLoading()"
    [itemsList]="itemsList()"
    (onPageChange)="onPageChange($event)"
    (onSelectAction)="onTableAction($event)"
  />
</section>

@if (isDialogVisible()) {
  <app-physical-server-dialog
    [(visible)]="isDialogVisible"
    [canRestore]="canRestore()"
    [environmentOptions]="environmentOptions()"
    [form]="entityForm"
    [isLoading]="isEntityLoading()"
    [isSaving]="isSaving()"
    [mode]="dialogMode()"
    [serverTypeCode]="serverTypeCode()"
    (cancelEdit)="cancelEntityEdit()"
    (closed)="closeDialog()"
    (deactivate)="deactivateSelected()"
    (edit)="startEntityEdit()"
    (restore)="restore()"
    (submitForm)="submitEntity()"
  />
}

@if (isDeleteDialogVisible()) {
  <app-confirmation-dialog
    [(visible)]="isDeleteDialogVisible"
    [cancelLabel]="deleteCancel"
    [confirmLabel]="deleteConfirm"
    [message]="deleteMessage()"
    [title]="copy().deleteTitle"
    (cancel)="closeDeleteDialog()"
    (confirm)="confirmDelete()"
  />
}
