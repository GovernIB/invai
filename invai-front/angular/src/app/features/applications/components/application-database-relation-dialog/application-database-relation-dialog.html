<app-crud-entity-dialog
  [(visible)]="visible"
  width="72rem"
  [ariaLabels]="actionAriaLabels"
  [canDeactivate]="false"
  [canEdit]="false"
  [isLoading]="isLoading()"
  [isSaving]="isSaving()"
  [mode]="mode()"
  [title]="title()"
  (closed)="closed.emit()"
  (submitForm)="submitForm.emit()"
>
  @if (mode() === 'create') {
    <div class="application-infrastructure-catalog-toolbar">
      <app-section-actions
        [hideAddButton]="true"
        [hideExportButton]="true"
        [hideColumnsButton]="true"
        [quickSearchValue]="quickSearch()"
        [quickSearchPlaceholder]="searchLabel"
        [quickSearchAriaLabel]="searchLabel"
        [isSearchLoading]="isLoading()"
        [filtersSelected]="filtersSelected()"
        [(isFiltersCollapsed)]="isFiltersCollapsed"
        (onQuickSearchChange)="quickSearchChange.emit($event)"
      />
    </div>
    @if (!isFiltersCollapsed()) {
      <div class="mb-4">
        <app-search-filters
          class="application-infrastructure-catalog-filters"
          [hideMoreFiltersButton]="true"
          [isLoading]="isLoading()"
          (onSearch)="filterSearch.emit()"
          (onReset)="filterReset.emit()"
        >
          <app-database-filters-form
            idPrefix="application-database-catalog-filter"
            [showStatus]="false"
            [form]="filtersForm()"
            [labels]="filterLabels"
            [serverOptions]="serverOptions()"
            [databaseTypeOptions]="databaseTypeOptions()"
          />
        </app-search-filters>
      </div>
    }
  }
  <div
    role="group"
    aria-labelledby="application-database-relation-selection-label"
    [attr.aria-describedby]="isInvalid() ? 'application-database-relation-selection-error' : null"
    [attr.aria-invalid]="isInvalid()"
  >
    <span id="application-database-relation-selection-label" class="sr-only">
      {{ title() }}
    </span>
    <app-application-infrastructure-catalog-table
      [columns]="columns"
      [first]="mode() === 'view' ? 0 : first()"
      [isLoading]="isLoading()"
      [isReadOnly]="mode() === 'view'"
      [itemsList]="displayedCatalog()"
      [selection]="form().controls.database.value"
      (pageChange)="pageChange.emit($event)"
      (selectionChange)="select($event)"
    />
    @if (isInvalid()) {
      <p
        id="application-database-relation-selection-error"
        class="mb-0 mt-2 text-sm text-red-600"
        role="alert"
      >
        {{ requiredError }}
      </p>
    }
  </div>
</app-crud-entity-dialog>
