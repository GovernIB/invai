<div class="invai-table-loading-container" [attr.aria-busy]="isLoading()">
  @if (isLoading()) {
    <div class="invai-table-loading-shield" aria-hidden="true">
      <span class="invai-table-refresh-indicator"></span>
    </div>
  }
  <p-table
    dataKey="id"
    paginatorDropdownAppendTo="body"
    styleClass="application-infrastructure-catalog-table"
    [columns]="columns()"
    [currentPageReportTemplate]="currentPageReportTemplate"
    [first]="first()"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="!isReadOnly()"
    [paginatorStyleClass]="paginatorStyleClass"
    [rowHover]="!isReadOnly()"
    [rows]="paginatorRows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [scrollable]="true"
    [showCurrentPageReport]="!isReadOnly()"
    [totalRecords]="itemsList().total"
    [value]="itemsList().items"
    (onLazyLoad)="pageChange.emit($event)"
  >
  <ng-template let-columns pTemplate="header">
    <tr>
      <th class="application-infrastructure-catalog-table__selection">
        <span class="sr-only">{{ selectAriaLabel }}</span>
      </th>
      @for (column of columns; track column.key) {
        <th
          [pSortableColumn]="isReadOnly() ? undefined : column.sortBy"
          [style.min-width]="column.minWidth"
          [style.width]="column.width"
        >
          <div class="invai-table-header-content">
            <span class="invai-table-header-label">{{ column.label }}</span>
            @if (!isReadOnly() && column.sortBy) {
              <p-sortIcon [field]="column.sortBy" />
            }
          </div>
        </th>
      }
    </tr>
  </ng-template>

  <ng-template let-columns="columns" let-rowData pTemplate="body">
    <tr
      [class.application-infrastructure-catalog-table__selected]="selection()?.id === rowData.id"
      [class.application-infrastructure-catalog-table__selectable]="!isReadOnly()"
      [attr.tabindex]="isReadOnly() ? null : 0"
      (click)="select(rowData)"
      (keydown.enter)="select(rowData)"
    >
      <td class="application-infrastructure-catalog-table__selection">
        <input
          type="radio"
          [attr.aria-label]="selectAriaLabel"
          [checked]="selection()?.id === rowData.id"
          [disabled]="isReadOnly()"
          (click)="$event.stopPropagation(); select(rowData)"
        />
      </td>
      @for (column of columns; track column.key) {
        <td [style.min-width]="column.minWidth" [style.width]="column.width">
          {{ rowData[column.key] }}
        </td>
      }
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="columns().length + 1">{{ resultsNotFound }}</td>
    </tr>
  </ng-template>
  </p-table>
</div>
