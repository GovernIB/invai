<form appSearchFilterGrid [formGroup]="form()">
  <div>
    <p-floatlabel class="w-full">
      <input
        id="applications-filter-prefix"
        class="w-full"
        type="text"
        formControlName="prefix"
        pInputText
      />
      <label id="applications-filter-prefix-label" for="applications-filter-prefix">
        {{ labels().prefix }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <input
        id="applications-filter-application"
        class="w-full"
        type="text"
        formControlName="application"
        pInputText
      />
      <label id="applications-filter-application-label" for="applications-filter-application">
        {{ labels().application }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-category"
        styleClass="w-full"
        formControlName="category"
        ariaLabelledBy="applications-filter-category-label"
        [ariaFilterLabel]="labels().category"
        [filter]="true"
        [options]="options()?.categories ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-category-label" for="applications-filter-category">
        {{ labels().category }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-information-system"
        styleClass="w-full"
        formControlName="informationSystem"
        ariaLabelledBy="applications-filter-information-system-label"
        [ariaFilterLabel]="labels().informationSystem"
        [filter]="true"
        [options]="options()?.informationSystems ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label
        id="applications-filter-information-system-label"
        for="applications-filter-information-system"
      >
        {{ labels().informationSystem }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-scope"
        styleClass="w-full"
        formControlName="scope"
        ariaLabelledBy="applications-filter-scope-label"
        [ariaFilterLabel]="labels().scope"
        [filter]="true"
        [options]="options()?.scopes ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-scope-label" for="applications-filter-scope">
        {{ labels().scope }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-commission"
        styleClass="w-full"
        formControlName="commission"
        ariaLabelledBy="applications-filter-commission-label"
        [ariaFilterLabel]="labels().commission"
        [filter]="true"
        [options]="options()?.commissions ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-commission-label" for="applications-filter-commission">
        {{ labels().commission }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-administrative-unit"
        styleClass="w-full"
        formControlName="administrativeUnit"
        ariaLabelledBy="applications-filter-administrative-unit-label"
        [ariaFilterLabel]="labels().administrativeUnit"
        [filter]="true"
        [options]="options()?.administrativeUnits ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label
        id="applications-filter-administrative-unit-label"
        for="applications-filter-administrative-unit"
      >
        {{ labels().administrativeUnit }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-status"
        styleClass="w-full"
        formControlName="status"
        ariaLabelledBy="applications-filter-status-label"
        [options]="statusOptions"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-status-label" for="applications-filter-status">
        {{ labels().status }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <input
        id="applications-filter-description"
        class="w-full"
        type="text"
        formControlName="description"
        pInputText
      />
      <label id="applications-filter-description-label" for="applications-filter-description">
        {{ labels().description }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <input
        id="applications-filter-responsible"
        class="w-full"
        type="text"
        formControlName="responsible"
        pInputText
      />
      <label id="applications-filter-responsible-label" for="applications-filter-responsible">
        {{ labels().responsible }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-database"
        styleClass="w-full"
        formControlName="database"
        ariaLabelledBy="applications-filter-database-label"
        [ariaFilterLabel]="labels().database"
        [filter]="true"
        [options]="infrastructureOptions()?.databases ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-database-label" for="applications-filter-database">
        {{ labels().database }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-server"
        styleClass="w-full"
        formControlName="server"
        ariaLabelledBy="applications-filter-server-label"
        [ariaFilterLabel]="labels().server"
        [filter]="true"
        [options]="infrastructureOptions()?.servers ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-server-label" for="applications-filter-server">
        {{ labels().server }}
      </label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full">
      <p-select
        inputId="applications-filter-environment"
        styleClass="w-full"
        formControlName="environment"
        ariaLabelledBy="applications-filter-environment-label"
        [ariaFilterLabel]="labels().environment"
        [filter]="true"
        [options]="infrastructureOptions()?.environments ?? []"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
      />
      <label id="applications-filter-environment-label" for="applications-filter-environment">
        {{ labels().environment }}
      </label>
    </p-floatlabel>
  </div>

  <div class="flex items-center gap-3">
    <span
      id="applications-filter-incomplete-label"
      class="flex items-center gap-2 text-color-secondary"
    >
      <span>{{ labels().incomplete }}</span>
      <i class="pi pi-exclamation-circle text-red-500" aria-hidden="true"></i>
    </span>
    <p-toggleswitch
      inputId="applications-filter-incomplete"
      ariaLabelledBy="applications-filter-incomplete-label"
      formControlName="incomplete"
    />
  </div>
</form>
