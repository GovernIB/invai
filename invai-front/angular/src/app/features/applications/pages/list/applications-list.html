<app-section-container [header]="header">
  <app-section-actions
    appearance="on-primary"
    [(isFiltersCollapsed)]="isFiltersCollapsed"
    [(quickSearchValue)]="quickSearchTerm"
    [(selectedColumns)]="selectedColumns"
    [availableColumns]="selectableColumns()"
    [addButtonAriaLabel]="addAriaLabel"
    [exportButtonAriaLabel]="exportAriaLabel"
    [filtersSelected]="selectedFilters()"
    [isSearchLoading]="isSearchIndicatorLoading()"
    [quickSearchAriaLabel]="quickSearchAriaLabel"
    (onAdd)="onNewApplication()"
    (onExport)="onExport()"
    (onQuickSearchChange)="onQuickSearchChange($event)"
    right-top
  >
    <p-button
      before-search
      [label]="dir3CheckLabel"
      [loading]="isDir3Checking()"
      [disabled]="isDir3Checking()"
      styleClass="section-actions__text-button"
      (onClick)="checkAllApplicationDir3()"
    />
  </app-section-actions>
  <span class="sr-only" role="status">{{ isDir3Checking() ? dir3CheckProgress : '' }}</span>

  @if (!isFiltersCollapsed()) {
    <app-search-filters
      [hideMoreFiltersButton]="true"
      [isDisable]="isLoading()"
      [isLoading]="isLoading()"
      (onReset)="reset()"
      (onSearch)="onFilterSearch()"
    >
      <app-application-filters-form
        [form]="filtersForm"
        [infrastructureOptions]="infrastructureFilterOptions()"
        [labels]="filterLabels"
        [options]="filterOptions()" [dir3]="dir3" (dir3Action)="dir3.handle($event)"
        [responsibleLoading]="isResponsibleSearchLoading()"
        [responsibleOptions]="responsibleOptions()"
        (responsibleSearch)="onResponsibleSearch($event)"
      />
    </app-search-filters>
  }

  <app-applications-table
    [columns]="sortedSelectedColumns()"
    [first]="tableFirst()"
    [isInitialLoading]="isInitialTableLoading()"
    [isLoading]="isLoading()"
    [itemsList]="itemsList()"
    (onPageChange)="onPageChange($event)"
    (onSelectAction)="onApplicationAction($event)"
  />
</app-section-container>
