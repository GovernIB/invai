<app-application-detail-section-layout
  titleId="application-responsible-section-title"
  [title]="sectionTitle"
>
  @if (detailState.canEdit()) {
    <app-application-detail-section-actions
      section-actions
      [isEditing]="detailState.isEditing('responsible')"
      [isSaving]="isSaving()"
      [sectionLabel]="sectionTitle"
      (cancel)="cancelEditing()"
      (edit)="startEditing()"
      (save)="save()"
    />
  }

  <app-application-responsible-form />
</app-application-detail-section-layout>
