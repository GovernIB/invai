<form [formGroup]="form()" novalidate>
  <app-application-form-fields
    idPrefix="detail-application"
    [controls]="form().controls"
    [auditControls]="form().controls"
    [isReadOnly]="isReadOnly()"
    [labels]="labels"
    [options]="options()"
    [departmentsLoading]="departmentsLoading()"
    [departmentsLoadFailed]="departmentsLoadFailed()"
    [administrativeUnitsLoading]="administrativeUnitsLoading()"
    [administrativeUnitsLoadFailed]="administrativeUnitsLoadFailed()"
    [prefixMaxLengthError]="prefixMaxLengthError"
    [requiredError]="requiredError"
    [selectPlaceholder]="selectPlaceholder"
    (commissionSelected)="selectCommission($event)"
    (conselleriaSelected)="selectConselleria($event)"
    (departmentsRetry)="departmentsRetry.emit()"
    (administrativeUnitsRetry)="administrativeUnitsRetry.emit()"
  />
</form>
