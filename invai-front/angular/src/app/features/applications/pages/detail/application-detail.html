<header class="application-detail-header">
  <h2>{{ pageHeader() }}</h2>
</header>

<app-section-container>
  <nav class="application-detail-tabs" [attr.aria-label]="sectionsAriaLabel">
    @for (tab of tabs; track tab.route) {
      <a
        class="application-detail-tab"
        [routerLink]="tab.route"
        routerLinkActive="application-detail-tab--active"
      >
        {{ tab.label }}
      </a>
    }
  </nav>

  <router-outlet />

  <p-dialog
    [closable]="true"
    [closeOnEscape]="true"
    [dismissableMask]="true"
    [draggable]="false"
    [modal]="true"
    [resizable]="false"
    [style]="{ width: '28rem', maxWidth: 'calc(100vw - 2rem)' }"
    [visible]="detailState.isUnsavedChangesDialogVisible()"
    (onHide)="closeUnsavedChangesDialog()"
  >
    <ng-template #header>
      <h2 class="m-0 text-base font-semibold text-color">
        {{ unsavedChangesTitle }}
      </h2>
    </ng-template>

    <p class="m-0 whitespace-pre-line text-sm leading-5 text-color-secondary">
      {{ unsavedChangesMessage() }}
    </p>

    <ng-template #footer>
      <div class="flex justify-end">
        <p-button
          [ariaLabel]="unsavedChangesCloseAriaLabel"
          [label]="unsavedChangesCloseLabel"
          (onClick)="closeUnsavedChangesDialog()"
        />
      </div>
    </ng-template>
  </p-dialog>
</app-section-container>
