@if (isInitialLoading()) {
  <main class="app-initial-loader" aria-live="polite" aria-busy="true">
    <img
      class="app-initial-loader__logo"
      src="assets/images/logo_govern_vertical_grande.svg"
      alt="Govern de les Illes Balears"
    />
    <section class="app-initial-loader__content" aria-label="INVAI">
      <img class="app-initial-loader__brand" src="assets/images/logo-invai.svg" alt="INVAI" />
      <p class="app-initial-loader__text">Preparant les dades inicials...</p>
    </section>
  </main>
} @else if (isLoggedIn) {
  <app-main-layout>
    <section class="flex shrink-0 items-center gap-4" header-left>
      <a
        class="flex items-center gap-3 no-underline"
        [routerLink]="homeRoute"
        [attr.aria-label]="homeAriaLabel"
      >
        <img
          class="h-[50px] w-auto"
          src="assets/images/logo_govern_horizontal.svg"
          alt="Govern de les Illes Balears"
        />
        <p-divider class="m-0 h-7" layout="vertical" />
        <img class="h-6 w-auto" src="assets/images/logo-invai.svg" [alt]="title" />
      </a>
    </section>

    <section class="flex shrink-0 items-center gap-1" header-right>
      <p-button
        data-testid="button-notifications-testid"
        icon="pi pi-bell"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        [ariaLabel]="notificationsAriaLabel"
      />

      <p-divider class="mx-2 my-0 h-7" layout="vertical" />

      <app-user-menu />
    </section>

    <ng-container content>
      <section class="invai-page-content">
        @if (!isBreadcrumbsHidden()) {
          <app-breadcrumbs styleClass="mt-4 mb-3 border-1 border-round surface-border p-3" />
        }
        <router-outlet />
      </section>
    </ng-container>
  </app-main-layout>
}

<aside>
  <p-toast />
  <app-server-error-dialog />
  <app-help-modal />
</aside>
